
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>HOW TO</title>

<style>
:root {
  color-scheme: light;
  --ink: #2c353e;
  --edge: #d9dfe6;
  --accent: #8797a5;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: #fafbfc;
  font-family: Arial, "Helvetica Neue",
    "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  color: var(--ink);
}

.stage {
  position: relative;
  isolation: isolate;
  padding: clamp(26px,5vw,64px) clamp(17px,5vw,56px);
  min-height: 520px;
  overflow: hidden;
}

.inner {
  position: relative;
  max-width: 1050px;
  margin: 0 auto;
  z-index: 1;
}

/* SEARCH */

.search {
  height: 63px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 30px;
  border: 1px solid var(--edge);
  background: #fff;
  color: #70818e;
}

.search svg { flex-shrink: 0; }

.search input {
  border: 0;
  background: transparent;
  outline: none;
  min-width: 0;
  width: 100%;
  font: inherit;
  font-size: 15px;
  color: #2b353f;
}

.search input::placeholder { color: #8d99a5; }

.search:focus-within {
  outline: 2px solid #9aa8b5;
  outline-offset: 2px;
}

/* CATEGORIES */

.cat {
  color: inherit;
  text-decoration: none;
  min-width: 0;
  transition: transform .18s ease, box-shadow .18s ease;
}

.cat:hover { transform: translateY(-1px); }

.cat:focus-visible {
  outline: 3px solid #8b9ba9;
  outline-offset: 3px;
}

.glyph {
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.glyph svg {
  width: 72%;
  height: 72%;
  display: block;
}

.name {
  line-height: 1.2;
  font-weight: 500;
  letter-spacing: -.035em;
  overflow-wrap: break-word;
  min-width: 0;
}

.name .qualifier {
  font: inherit;
  letter-spacing: inherit;
  white-space: nowrap;
}

/* SELECTED LAYOUT */

.v06 {
  background: linear-gradient(
    90deg,
    #eef2f6 0 10%,
    #fff 10% 90%,
    #eef2f6 90%
  );
}

.v06 .search {
  max-width: 820px;
  margin-inline: auto;
  border-radius: 15px;
  box-shadow: 0 8px 21px #8997a619;
}

.v06 .cats {
  max-width: 945px;
  margin: auto;
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.v06 .cat {
  min-height: 112px;
  padding: 13px 22px;
  display: flex;
  align-items: center;
  gap: 22px;
  background: linear-gradient(115deg,#fdfefe,#eff3f6 66%,#fff);
  border: 2px solid #d0d9e1;
  border-radius: 15px;
  box-shadow: inset 0 0 0 5px #ffffffb5;
}

.v06 .glyph {
  height: 83px;
  width: 83px;
  color: #7f8f9a;
  border: 1px solid #d4dce4;
  border-radius: 16px;
  background: #ffffffea;
}

.v06 .name { font-size: 27px; }

/* HYBRID */

.v36 .cat { border-radius: 100px !important; }

.v36 .glyph { border-radius: 50%; }

/* SHORT CATEGORY BUTTONS */

.v06.v36.shorter-bottom .cats {
  width: 74%;
  max-width: 700px;
}

/* ICON DESIGN 01 */

.glyph svg.motif-01 { color: #344553; }

.glyph svg.motif-01 g,
.glyph svg.motif-01 path,
.glyph svg.motif-01 rect,
.glyph svg.motif-01 circle,
.glyph svg.motif-01 line,
.glyph svg.motif-01 polygon,
.glyph svg.motif-01 ellipse {
  stroke-linecap: round;
  stroke-linejoin: round;
}

.glyph svg.motif-01 path,
.glyph svg.motif-01 rect,
.glyph svg.motif-01 circle,
.glyph svg.motif-01 polygon,
.glyph svg.motif-01 ellipse {
  stroke: currentColor;
  stroke-width: 4;
  fill: none;
}

.glyph svg.motif-01 .thin {
  stroke-width: 2.3;
  opacity: .7;
}

.glyph svg.motif-01 .tint { fill: #e8f1f7; }

.glyph svg.motif-01 .solid {
  stroke: none;
  fill: currentColor;
}

.glyph svg.motif-01 .accent { fill: #8da7bb; }

/* HOW TO MASTHEAD */

.howto-masthead {
  max-width: 820px;
  margin: 0 auto 34px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  isolation: isolate;
  text-align: center;
}

.howto-star-row {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(12px,4vw,34px);
}

.howto-rule {
  height: 1px;
  background: linear-gradient(90deg,transparent,#b2bdc7 32%,#d9e1e7);
  flex: 1;
  max-width: 210px;
}

.howto-rule:last-child { transform: rotate(180deg); }

.howto-hero-star {
  display: block;
  width: clamp(88px,11vw,132px);
  height: clamp(88px,11vw,132px);
  flex: none;
  filter: drop-shadow(0 4px 6px #7f8d981a);
}

.howto-masthead h1 {
  position: relative;
  margin: 0;
  font-family: Didot, "Bodoni MT", "Times New Roman", Georgia, serif;

  /* UPDATED: SMALLER TITLE */
  font-size: clamp(54px,8.5vw,100px);

  font-weight: 500;
  line-height: 1.04;
  letter-spacing: -.075em;
  white-space: nowrap;
  color: #26313a;
}

.howto-masthead h1 span {
  display: block;
  transform: scaleX(.96);
}

/* MOBILE */

@media (max-width:700px) {
  .stage {
    min-height: unset;
    padding: 24px 16px 32px;
  }

  .search {
    height: 53px;
    padding: 0 14px;
    margin-bottom: 23px;
    gap: 10px;
  }

  .search input { font-size: 14px; }

  .v06 .cat {
    min-height: 91px;
    gap: 15px;
    padding: 10px 12px;
    border-radius: 12px;
  }

  .v06 .glyph {
    width: 64px;
    height: 64px;
    border-radius: 13px;
  }

  .v06 .name { font-size: 20px; }

  .v36 .cat { border-radius: 100px !important; }
  .v36 .glyph { border-radius: 50%; }

  .howto-masthead { margin-bottom: 26px; }

  .howto-masthead h1 {
    font-size: clamp(49px,10.5vw,72px);
  }

  .howto-rule { max-width: 105px; }
}

@media (max-width:480px) {
  .v06.v36.shorter-bottom .cats {
    width: 77%;
    min-width: 255px;
    max-width: 100%;
  }
}

@media (max-width:360px) {
  .howto-masthead h1 { font-size: 49px; }
  .howto-star-row { gap: 12px; }
}

@media (max-width:350px) {
  .v06.v36.shorter-bottom .cats {
    width: 93%;
    min-width: 0;
  }
}
</style>
</head>

<body>

<div class="stage v06 v36 shorter-bottom">
<div class="inner">

<header class="howto-masthead">
  <div class="howto-star-row" aria-hidden="true">
    <span class="howto-rule"></span>

    <svg class="howto-hero-star"
         viewBox="0 0 120 120"
         xmlns="http://www.w3.org/2000/svg">
      <polygon
        points="60,4 76,43 118,44 85,70 96,113 60,90 24,113 35,70 2,44 44,43"
        fill="#e8edf1"
        stroke="#8594a1"
        stroke-width="1.5"
        stroke-linejoin="round"
      />
      <polygon
        points="60,17 72.2,49 104,50 79,71 87,97 60,82 33,97 41,71 16,50 47.8,49"
        fill="#fafdff"
        stroke="#c6d0d8"
        stroke-width="1.05"
        stroke-linejoin="round"
      />
    </svg>

    <span class="howto-rule"></span>
  </div>

  <h1><span>HOW TO</span></h1>
</header>

<div class="search" role="search">
  <svg aria-hidden="true" fill="none"
       height="20" width="20"
       stroke="currentColor"
       stroke-linecap="round"
       stroke-width="1.7"
       viewBox="0 0 24 24">
    <circle cx="10.8" cy="10.8" r="7.2"></circle>
    <path d="m16.2 16.2 4.6 4.6"></path>
  </svg>
  <input
    aria-label="全体から検索"
    autocomplete="off"
    placeholder="全体から検索（複数ワード可）"
    type="search"
  />
</div>

<div class="cats">

  <div aria-label="Physical (CD)" class="cat" role="group">
    <span class="glyph">
      <svg aria-hidden="true" class="motif-01"
           viewBox="0 0 120 120"
           xmlns="http://www.w3.org/2000/svg">
        <circle cx="60" cy="60" r="39"></circle>
        <circle cx="60" cy="60" r="11"></circle>
        <circle class="solid" cx="60" cy="60" r="3"></circle>
        <path class="thin" d="M40 31A34 34 0 0 1 72 23"></path>
      </svg>
    </span>
    <span class="name">Physical <span class="qualifier">(CD)</span></span>
  </div>

  <div aria-label="Music Video (MV)" class="cat" role="group">
    <span class="glyph">
      <svg aria-hidden="true" class="motif-01"
           viewBox="0 0 120 120"
           xmlns="http://www.w3.org/2000/svg">
        <rect height="66" rx="12" width="92" x="14" y="27"></rect>
        <path class="solid accent" d="M51 44 L81 60 L51 77 Z"></path>
      </svg>
    </span>
    <span class="name">Music Video <span class="qualifier">(MV)</span></span>
  </div>

  <div aria-label="Streaming (ST)" class="cat" role="group">
    <span class="glyph">
      <svg aria-hidden="true" class="motif-01"
           viewBox="0 0 120 120"
           xmlns="http://www.w3.org/2000/svg">
        <path d="M27 64V53a33 33 0 0 1 66 0v11"></path>
        <rect class="tint" height="35" rx="9" width="20" x="21" y="59"></rect>
        <rect class="tint" height="35" rx="9" width="20" x="79" y="59"></rect>
      </svg>
    </span>
    <span class="name">Streaming <span class="qualifier">(ST)</span></span>
  </div>

  <div aria-label="Download (DL)" class="cat" role="group">
    <span class="glyph">
      <svg aria-hidden="true" class="motif-01"
           viewBox="0 0 120 120"
           xmlns="http://www.w3.org/2000/svg">
        <path d="M60 20v55 M42 57l18 18 18-18"></path>
        <path d="M24 83v16h72V83"></path>
      </svg>
    </span>
    <span class="name">Download <span class="qualifier">(DL)</span></span>
  </div>

  <div aria-label="Radio" class="cat" role="group">
    <span class="glyph">
      <svg aria-hidden="true" class="motif-01"
           viewBox="0 0 120 120"
           xmlns="http://www.w3.org/2000/svg">
        <path d="M30 38 L67 20"></path>
        <rect class="tint" height="59" rx="9" width="88" x="16" y="38"></rect>
        <circle cx="42" cy="67" r="15"></circle>
        <path d="M70 59h23M70 69h23M70 79h16"></path>
      </svg>
    </span>
    <span class="name">Radio</span>
  </div>

  <div aria-label="Karaoke" class="cat" role="group">
    <span class="glyph">
      <svg aria-hidden="true" class="motif-01"
           viewBox="0 0 120 120"
           xmlns="http://www.w3.org/2000/svg">
        <g transform="rotate(-36 60 60)">
          <rect class="tint" height="39" rx="14" width="28" x="46" y="14"></rect>
          <path d="M49 53h22l-7 46h-8z"></path>
          <path d="M48 56h24"></path>
        </g>
      </svg>
    </span>
    <span class="name">Karaoke</span>
  </div>

</div>
</div>
</div>

</body>
</html>
