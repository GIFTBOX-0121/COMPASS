
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>COMPASS | 管理画面</title>
<style>
:root{--navy:#344c68;--gold:#c49a42;--bg:#f3f6fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#273648;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
header{background:var(--navy);color:white;padding:25px;text-align:center}
h1{margin:0;letter-spacing:.15em}
main{max-width:780px;margin:auto;padding:16px 12px 70px}
.panel{background:white;border:1px solid #dce3ec;border-radius:16px;padding:18px;margin-bottom:16px}
h2{font-size:17px;color:var(--navy)}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}
input,textarea,select{width:100%;font:inherit;border:1px solid #cbd5e1;border-radius:9px;padding:11px;background:white;color:#273648}
textarea{min-height:75px}
button{font:inherit;border:0;border-radius:9px;padding:11px 13px;cursor:pointer}
button:disabled{opacity:.5}
.gold{background:var(--gold);color:white}
.light{background:#edf1f6;color:var(--navy)}
.danger{background:#fff0f0;color:#a22}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{flex:1}
.hidden{display:none!important}
.note{font-size:12px;color:#69798c;line-height:1.7}
.remember{display:flex;gap:10px;align-items:center;padding:12px;background:#f3f6fa;border-radius:10px}
.remember input{width:20px;height:20px;accent-color:var(--gold)}
.mode{padding:12px;border-radius:9px;background:#edf1f6;color:var(--navy);font-weight:bold}
.mode.edit{background:#fff3d9;color:#755512}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.toolbar button{background:#edf1f6}
.toolbar select{width:auto;max-width:180px}
.toolbar input[type=color]{width:45px;padding:2px;height:40px}
#editor{
 border:1px solid #cbd5e1;border-radius:10px;padding:14px;
 height:min(85vw,390px);min-height:270px;max-height:390px;
 overflow-y:auto;overscroll-behavior:contain;
 -webkit-overflow-scrolling:touch;line-height:1.8;
 overflow-wrap:anywhere;outline:none;background:white
}
#editor:focus{border-color:#93a2b0}
#editor img,#editor video{max-width:100%;height:auto}
#editor video{display:block;margin:10px 0}
.editor-help{margin:7px 0 10px;font-size:12px;color:#69798c}
.marker-tools{
 display:flex;align-items:center;flex-wrap:wrap;gap:6px;
 padding:8px;border:1px solid #dce3ec;
 border-radius:10px;background:#f8fafc
}
.marker-tools span{font-size:12px;font-weight:700;margin-right:4px}
.marker-btn{
 width:35px;height:35px;padding:0;border:1px solid #cbd5e1;
 border-radius:8px;position:relative
}
.marker-btn.active{outline:2px solid var(--navy);outline-offset:2px}
.marker-btn[data-color="#fff1a8"]{background:#fff1a8}
.marker-btn[data-color="#ffd5df"]{background:#ffd5df}
.marker-btn[data-color="#cdebff"]{background:#cdebff}
.marker-btn[data-color="#ddf2c9"]{background:#ddf2c9}
.marker-btn[data-color="#remove"]{background:white}
.marker-btn[data-color="remove"]{background:white}
.marker-btn[data-color="remove"]::after{
 content:"×";font-size:23px;color:#64748b
}
 .color-apply{background:#edf1f6;font-size:12px;padding:9px 11px}
#editor .compass-marker{border-radius:.3em;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .08em}
#editor .compass-underline{text-decoration-line:underline}

.item{border-top:1px solid #dce3ec;padding:13px 0}
.item small{display:block;color:#728096;margin:5px 0}
#message,#uploadStatus{font-size:13px;color:#344c68;white-space:pre-wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tabs button{padding:8px 11px;font-size:13px;background:#edf1f6;color:var(--navy)}
.tabs button.active{background:var(--navy);color:white}
.status-tabs{border-bottom:1px solid #dce3ec;padding-bottom:9px;margin-top:3px}
.status-tabs button{flex:1;font-weight:700}
.status-tabs button.active{background:var(--gold);color:white}
.related-picker{
 border:1px solid #dce3ec;border-radius:12px;
 background:#f8fafc;padding:13px;margin:10px 0
}
.related-picker input{margin-bottom:8px}
.related-list{max-height:240px;overflow:auto}
.related-choice{
 display:block;width:100%;text-align:left;
 padding:11px;margin:5px 0;background:white;
 border:1px solid #dce3ec;color:#273648
}
.related-choice small{display:block;color:#728096;margin-top:4px}
#editor a.compass-related{
 display:block;text-decoration:none;color:#273648;
 border:1px solid #dce3ec;border-left:4px solid #c49a42;
 border-radius:10px;background:#f8fafc;
 padding:12px 15px;margin:12px 0
}
#editor .compass-related-label{
 display:block;color:#728096;font-size:12px
}
#editor .compass-related-title{
 display:block;font-weight:700;color:#344c68
}
#editor .compass-related-note{
 display:block;font-size:12px;color:#728096
}
@media(max-width:767px){
 body.editor-active{padding-bottom:110px}
 body.editor-active .toolbar,
 body.editor-active .marker-tools{
  position:fixed;left:8px;right:8px;z-index:9999;
  margin:0;background:rgba(255,255,255,.97);
  border:1px solid #dce3ec;
  box-shadow:0 -3px 18px #344c6820
 }
 body.editor-active .toolbar{
  bottom:calc(var(--keyboard-offset,0px) + 49px);
  display:flex;flex-wrap:nowrap;overflow-x:auto;
  overflow-y:hidden;gap:6px;padding:7px 9px;
  border-radius:12px 12px 0 0;
  scrollbar-width:none;-webkit-overflow-scrolling:touch
 }
 body.editor-active .toolbar::-webkit-scrollbar{display:none}
 body.editor-active .toolbar>*{flex:0 0 auto}
 body.editor-active .toolbar button{white-space:nowrap;min-height:36px}
 body.editor-active .toolbar select{
  max-width:125px;min-height:36px;padding:6px
 }
 body.editor-active .marker-tools{
  bottom:var(--keyboard-offset,0px);height:49px;
  flex-wrap:nowrap;overflow-x:auto;padding:6px 10px;
  border-radius:0 0 12px 12px
 }
 body.editor-active .marker-btn{flex:0 0 35px}
}
</style>
</head>
<body>
<header><h1>COMPASS</h1></header>
<main>
<section class="panel" id="loginPanel">
<h2>◆ 管理者認証</h2>
<label>Worker URL</label>
<input id="api" type="url" placeholder="https://compass-api.xxxxx.workers.dev">
<label>認証キー</label>
<input id="token" type="password" autocomplete="off">
<label class="remember">
<input id="remember" type="checkbox">
この端末に認証キーを保存する
</label>
<p class="note">共用端末では保存しないでください。</p>
<button id="loginBtn" class="gold" style="width:100%">ログイン</button>
<p id="message" role="status"></p>
</section>

<section id="workspace" class="hidden">
<section class="panel">
<div class="row">
<h2 style="flex:1;margin:7px 0">記事管理</h2>
<button id="logoutBtn" class="light">ログアウト</button>
<button id="forgetBtn" class="danger">保存キー削除</button>
</div>
</section>

<section class="panel" id="formPanel">
<div id="mode" class="mode">✦ 新規記事を作成中</div>
<h2 id="formHeading">新しい記事</h2>

<label>カテゴリー</label>
<select id="category">
<option value="physical">Physical</option>
<option value="mv">MV</option>
<option value="streaming">Streaming</option>
<option value="download">Download</option>
<option value="radio">Radio</option>
<option value="karaoke">Karaoke</option>
<option value="other">Other</option>
</select>

<label>記事タイトル</label>
<input id="title" maxlength="180" placeholder="記事のタイトル">

<label>検索キーワード</label>
<textarea id="searchKeywords" maxlength="3000"
 placeholder="例：CD、円盤、フィジカル、オリコン"></textarea>
<p class="note">
カンマ・読点・改行で区切って複数登録できます。
検索用なので記事本文には表示されません。
</p>

<label>本文</label>
<div class="toolbar">
<button type="button" data-cmd="bold"><b>B</b></button>
<button type="button" data-cmd="italic"><i>I</i></button>

<select id="underlineStyle" aria-label="下線の種類">
<option value="">下線を変更</option>
<option value="none">下線なし</option>
<option value="solid">下線 ─</option>
<option value="double">二重 ═</option>
<option value="wavy">波線 ﹏</option>
<option value="dotted">点線 ···</option>
<option value="dashed">破線 ---</option>
</select>

<select id="fontSize">
<option value="">文字サイズ</option>
<option value="3">標準</option>
<option value="2">小</option>
<option value="4">大</option>
<option value="5">特大</option>
</select>

<input id="fontColor" type="color" value="#344c68" aria-label="文字色">
<button type="button" id="applyColorBtn" class="color-apply">文字色を適用</button>
<button type="button" id="defaultColorBtn" class="color-apply">デフォルト色に戻す</button>
<button type="button" id="linkBtn">リンク設定・変更</button>
<button type="button" id="unlinkBtn">リンク解除</button>
<button type="button" id="relatedBtn">COMPASS記事を挿入</button>
<button type="button" id="imageUrlBtn">画像URL</button>
<button type="button" id="imageFileBtn">写真を選ぶ</button>
<button type="button" id="videoUrlBtn">動画URL</button>
<button type="button" id="videoFileBtn">動画を選ぶ</button>
</div>

<div class="marker-tools" role="group" aria-label="文字のマーカー">
<span>マーカー</span>
<button type="button" class="marker-btn" data-color="#fff1a8" aria-label="黄色マーカー"></button>
<button type="button" class="marker-btn" data-color="#ffd5df" aria-label="ピンクマーカー"></button>
<button type="button" class="marker-btn" data-color="#cdebff" aria-label="水色マーカー"></button>
<button type="button" class="marker-btn" data-color="#ddf2c9" aria-label="緑マーカー"></button>
<button type="button" class="marker-btn" data-color="remove" aria-label="マーカーを消す"></button>
</div>

<div id="relatedPicker" class="related-picker hidden">
<label for="relatedSearch">挿入する公開記事を選択</label>
<input id="relatedSearch" type="search" placeholder="記事タイトルで検索">
<div id="relatedList" class="related-list"></div>
<button type="button" id="closeRelatedBtn" class="light">閉じる</button>
</div>

<p class="editor-help">
文字を選択してから書式を設定してください。本文は枠内をスクロールできます。
リンクの変更はリンク内にカーソルを置いて操作できます。
</p>

<input id="imageInput" class="hidden" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
<input id="videoInput" class="hidden" type="file" accept="video/mp4,video/webm,video/quicktime,video/*">

<div id="editor" contenteditable="true" role="textbox" aria-label="記事本文" aria-multiline="true"></div>
<p id="uploadStatus" role="status"></p>

<div class="row">
<button id="draftBtn" class="light">下書き保存</button>
<button id="publishBtn" class="gold">公開する</button>
</div>
<button id="resetBtn" class="light" style="width:100%;margin-top:10px">
新しい記事を書く
</button>
</section>

<section class="panel">
<h2>登録済みの記事</h2>
<button id="reloadBtn" class="light">一覧を更新</button>
<div id="tabs" class="tabs" role="group" aria-label="カテゴリー別の記事一覧"></div>
<div id="statusTabs" class="tabs status-tabs" role="group" aria-label="公開状態別の記事一覧"></div>
<div id="articles"></div>
</section>
</section>
</main>

<script>
(function(){
'use strict';

const $=id=>document.getElementById(id);
const API_KEY='compass_api_url';
const TOKEN_KEY='compass_admin_token';

const names={
 all:'ALL',
 physical:'Physical',
 mv:'MV',
 streaming:'ST',
 download:'DL',
 radio:'Radio',
 karaoke:'Karaoke',
 other:'Other'
};

let auth='';
let editingId=null;
let editingTitle='';
let editingSummary='';
let articles=[];
let busy=false;
let filter='all';
let statusFilter='published';
let selection=null;

$('api').value=localStorage.getItem(API_KEY)||'';

function msg(s){
 $('message').textContent=s;
}

function base(){
 const s=$('api').value.trim().replace(/\/+$/,'');
 if(!/^https:\/\//.test(s)){
  throw Error('Worker URLはhttps://から入力してください');
 }
 return s;
}

async function req(path,method='GET',data){
 const headers={Authorization:'Bearer '+auth};
 if(data!==undefined){
  headers['Content-Type']='application/json';
 }
 const res=await fetch(base()+path,{
  method,
  headers,
  body:data===undefined?undefined:JSON.stringify(data),
  cache:'no-store'
 });
 const obj=await res.json().catch(()=>({}));
 if(!res.ok){
  throw Error(obj.error||'HTTP '+res.status);
 }
 return obj;
}

async function login(auto=false){
 try{
  auth=$('token').value.trim();
  if(!auth)throw Error('認証キーを入力してください');
  const result=await req('/api/login','POST');
  if(!result.ok)throw Error('認証できませんでした');

  localStorage.setItem(API_KEY,base());

  if($('remember').checked){
   localStorage.setItem(TOKEN_KEY,auth);
  }else{
   localStorage.removeItem(TOKEN_KEY);
  }

  $('loginPanel').classList.add('hidden');
  $('workspace').classList.remove('hidden');
  await load();
 }catch(e){
  $('workspace').classList.add('hidden');
  $('loginPanel').classList.remove('hidden');
  if(auto){
   auth='';
   msg('自動ログインできませんでした。認証キーを確認してください。 '+e.message);
  }else{
   msg('ログインエラー: '+e.message);
  }
 }
}

function reset(){
 editingId=null;
 editingTitle='';
 editingSummary='';
 selection=null;
 $('title').value='';
 $('searchKeywords').value='';
 $('category').value='physical';
 $('editor').innerHTML='';
 $('editor').scrollTop=0;
 $('fontSize').value='';
 $('fontColor').value='#344c68';
 $('underlineStyle').value='';
 $('relatedPicker').classList.add('hidden');
 $('mode').className='mode';
 $('mode').textContent='✦ 新規記事を作成中';
 $('formHeading').textContent='新しい記事';
 $('uploadStatus').textContent='';
}

function logout(){
 auth='';
 const saved=localStorage.getItem(TOKEN_KEY);
 $('token').value=saved||'';
 $('remember').checked=Boolean(saved);
 $('workspace').classList.add('hidden');
 $('loginPanel').classList.remove('hidden');
 reset();
 msg(saved?'ログアウトしました。認証キーはこの端末に保存されています。':'ログアウトしました。');
}

function forgetToken(){
 if(!confirm('この端末に保存した認証キーを削除しますか？'))return;
 auth='';
 localStorage.removeItem(TOKEN_KEY);
 $('token').value='';
 $('remember').checked=false;
 $('workspace').classList.add('hidden');
 $('loginPanel').classList.remove('hidden');
 reset();
 msg('この端末の認証キーを削除しました。');
}

async function load(){
 try{
  const result=await req('/api/articles');
  articles=result.articles||[];
  render();
 }catch(e){
  alert('記事一覧取得エラー: '+e.message);
 }
}

function render(){
 const categoryTabs=$('tabs');
 categoryTabs.replaceChildren();

 for(const [key,name] of Object.entries(names)){
  const count=articles.filter(a=>
   (key==='all'||a.category===key)&&a.status===statusFilter
  ).length;

  const b=document.createElement('button');
  b.textContent=name+' ('+count+')';
  b.className=key===filter?'active':'';
  b.setAttribute('aria-pressed',String(key===filter));
  b.onclick=()=>{
   filter=key;
   render();
  };
  categoryTabs.append(b);
 }

 const statusTabs=$('statusTabs');
 statusTabs.replaceChildren();

 for(const [key,name] of [
  ['published','公開中'],
  ['draft','下書き']
 ]){
  const count=articles.filter(a=>
   a.status===key&&(filter==='all'||a.category===filter)
  ).length;

  const b=document.createElement('button');
  b.textContent=name+' ('+count+')';
  b.className=key===statusFilter?'active':'';
  b.setAttribute('aria-pressed',String(key===statusFilter));
  b.onclick=()=>{
   statusFilter=key;
   render();
  };
  statusTabs.append(b);
 }

 const root=$('articles');
 root.replaceChildren();

 const list=articles.filter(a=>
  (filter==='all'||a.category===filter)&&a.status===statusFilter
 );

 if(!list.length){
  root.textContent=statusFilter==='draft'
   ?'このカテゴリーに下書きはありません'
   :'このカテゴリーに公開中の記事はありません';
  return;
 }

 for(const a of list){
  const item=document.createElement('div');
  item.className='item';

  const name=document.createElement('strong');
  name.textContent=a.title;

  const info=document.createElement('small');
  info.textContent=
   (names[a.category]||a.category)+' / '+
   (a.status==='published'?'公開中':'下書き')+' / '+
   (a.updated_at||'').slice(0,10);

  const buttons=document.createElement('div');
  buttons.className='row';

  const edit=document.createElement('button');
  edit.className='light';
  edit.textContent='編集';
  edit.onclick=()=>editArticle(a.id);

  const del=document.createElement('button');
  del.className='danger';
  del.textContent='削除';
  del.onclick=()=>deleteArticle(a.id,a.title);

  buttons.append(edit,del);
  item.append(name,info,buttons);
  root.append(item);
 }
}

function safeUrl(s){
 try{
  const u=new URL(s);
  return ['https:','http:'].includes(u.protocol);
 }catch{
  return false;
 }
}

function clean(html){
 const doc=new DOMParser().parseFromString('<div>'+html+'</div>','text/html');
 const root=doc.body.firstElementChild;

 const allowed=new Set([
  'DIV','P','BR','B','STRONG','I','EM','U','S',
  'SPAN','FONT','A','UL','OL','LI','BLOCKQUOTE',
  'H2','H3','H4','IMG','VIDEO','SOURCE'
 ]);

 const blocked=new Set([
  'SCRIPT','STYLE','IFRAME','OBJECT','EMBED',
  'FORM','INPUT','SVG','MATH','AUDIO','META','LINK'
 ]);

 for(const el of Array.from(root.querySelectorAll('*')).reverse()){
  if(!el.isConnected)continue;

  if(blocked.has(el.tagName)){
   el.remove();
   continue;
  }

  if(!allowed.has(el.tagName)){
   el.replaceWith(...Array.from(el.childNodes));
   continue;
  }

  for(const at of Array.from(el.attributes)){
   const n=at.name.toLowerCase();
   const v=at.value.trim();

   if(n==='href'&&el.tagName==='A'&&safeUrl(v))continue;
   if(n==='src'&&['IMG','VIDEO','SOURCE'].includes(el.tagName)&&safeUrl(v))continue;
   if(n==='alt'&&el.tagName==='IMG')continue;
   if(n==='controls'&&el.tagName==='VIDEO')continue;
   if(n==='preload'&&el.tagName==='VIDEO'&&['none','metadata','auto'].includes(v))continue;
   if(n==='playsinline'&&el.tagName==='VIDEO')continue;
   if(n==='type'&&el.tagName==='SOURCE'&&/^video\/(mp4|webm|quicktime)$/.test(v))continue;
   if(n==='size'&&el.tagName==='FONT'&&/^[1-7]$/.test(v))continue;
   if(n==='color'&&el.tagName==='FONT'&&/^#[0-9a-f]{3,8}$/i.test(v))continue;

   if(n==='class'){
    const permitted={
     A:['compass-related'],
     SPAN:[
      'compass-marker','compass-underline',
      'compass-related-label',
      'compass-related-title',
      'compass-related-note'
     ]
    };
    const valid=(permitted[el.tagName]||[])
     .filter(c=>el.classList.contains(c));
    if(valid.length){
     el.className=valid.join(' ');
    }else{
     el.removeAttribute('class');
    }
    continue;
   }

   if(n==='style'){
    const parts=v.split(';')
     .map(x=>x.trim())
     .filter(x=>
      /^(color|background-color|font-size|font-weight|text-align|text-decoration|text-decoration-line|text-decoration-style|text-decoration-color|border-radius)\s*:/i.test(x)
      && !/[()\\]/.test(x)
     );

    if(parts.length){
     el.setAttribute('style',parts.join(';'));
    }else{
     el.removeAttribute('style');
    }
    continue;
   }

   el.removeAttribute(at.name);
  }

  if(el.tagName==='A'){
   el.setAttribute('rel','noopener noreferrer');
  }
 }

 return root.innerHTML;
}

async function editArticle(id){
 if(busy)return;

 if(
  (
   $('title').value.trim()||
   $('searchKeywords').value.trim()||
   $('editor').textContent.trim()
  )
  &&!confirm('現在入力中の内容を破棄して記事を編集しますか？')
 )return;

 try{
  const a=(await req('/api/articles/'+encodeURIComponent(id))).article;

  editingId=a.id;
  editingTitle=a.title;
  editingSummary=a.summary||'';
  selection=null;

  $('category').value=a.category;
  $('title').value=a.title;
  $('searchKeywords').value=a.search_keywords||'';

  let body={};
  try{
   body=JSON.parse(a.body_json||'{}');
  }catch(e){}

  $('editor').innerHTML=clean(body.html||'');
  $('editor').scrollTop=0;
  $('fontSize').value='';

  $('mode').className='mode edit';
  $('mode').textContent='⚠ 既存記事を編集中：'+a.title;
  $('formHeading').textContent='記事を編集';

  $('formPanel').scrollIntoView({
   behavior:'smooth',
   block:'start'
  });
 }catch(e){
  alert('読み込みエラー: '+e.message);
 }
}

async function save(status){
 if(busy)return;
 const title=$('title').value.trim();
 if(!title){alert('記事タイトルを入力してください');return;}
 const id=editingId;
 if(id&&!confirm('既存の記事「'+editingTitle+'」を上書き保存します。よろしいですか？'))return;

 const data={
  category:$('category').value,
  title,
  summary:editingSummary,
  search_keywords:$('searchKeywords').value.trim(),
  body_json:JSON.stringify({html:clean($('editor').innerHTML)}),
  status
 };
 busy=true;
 $('draftBtn').disabled=true;
 $('publishBtn').disabled=true;
 try{
  const saved=await req(
   id?'/api/articles/'+encodeURIComponent(id):'/api/articles',
   id?'PUT':'POST',data
  );
  const savedId=saved.id||id;
  if(!savedId)throw Error('保存後の記事IDを確認できませんでした');

  // 保存完了を表示する前にD1から再取得し、本文まで一致するか検証
  const checked=await req('/api/articles/'+encodeURIComponent(savedId));
  const a=checked.article;
  if(!a||a.body_json!==data.body_json||
     a.title!==data.title||a.status!==data.status||
     a.category!==data.category){
   throw Error('保存後の本文・公開状態が一致しません。編集内容を残しています。');
  }

  // 公開した場合は、公開APIも最新本文を返すか確認
  if(status==='published'){
   const response=await fetch(
    base()+'/api/public/articles/'+encodeURIComponent(savedId)+'?v='+Date.now(),
    {cache:'no-store'}
   );
   if(!response.ok)throw Error('公開記事の取得確認に失敗しました（HTTP '+response.status+'）。編集内容を残しています。');
   const publicData=await response.json();
   if(publicData.article?.body_json!==data.body_json){
    throw Error('公開ページ用APIの本文が更新されていません。編集内容を残しています。');
   }
  }

  reset();
  statusFilter=status;
  filter='all';
  await load();
  alert(status==='published'
   ?'本文と公開データの更新を確認しました。保存完了！'
   :'下書きの本文が保存されたことを確認しました！');
 }catch(e){
  alert('保存・反映確認エラー：'+e.message+'\\n編集画面は保持しています。');
 }finally{
  busy=false;
  $('draftBtn').disabled=false;
  $('publishBtn').disabled=false;
 }
}

/* 選択範囲の保持 */
function rangeInsideEditor(range){
 return !!range &&
  $('editor').contains(range.startContainer) &&
  $('editor').contains(range.endContainer);
}

function rememberSelection(){
 const s=window.getSelection();
 if(s&&s.rangeCount&&rangeInsideEditor(s.getRangeAt(0))){
  selection=s.getRangeAt(0).cloneRange();
 }
}

function restoreSelection(){
 if(selection&&rangeInsideEditor(selection)){
  const s=window.getSelection();
  s.removeAllRanges();
  s.addRange(selection.cloneRange());
 }
 $('editor').focus({preventScroll:true});
}

function selectedRange(){
 restoreSelection();
 const s=window.getSelection();
 if(!s||!s.rangeCount)return null;
 const range=s.getRangeAt(0);
 return rangeInsideEditor(range)?range:null;
}

function applyCommand(command,value){
 const range=selectedRange();
 if(!range||range.collapsed){
  alert('書式を変えたい文字を選択してください');
  return;
 }
 document.execCommand(command,false,value);
 rememberSelection();
}

function insertNode(node){
 restoreSelection();
 const s=window.getSelection();

 if(s&&s.rangeCount&&rangeInsideEditor(s.getRangeAt(0))){
  const range=s.getRangeAt(0);
  range.deleteContents();
  range.insertNode(node);
  range.setStartAfter(node);
  range.collapse(true);
  s.removeAllRanges();
  s.addRange(range);
 }else{
  $('editor').append(node);
 }
 rememberSelection();
}

/* 書式操作：選択部分を包み、古い装飾の親要素から切り離す */
function unwrapElement(el){
 if(!el.parentNode)return;
 el.replaceWith(...Array.from(el.childNodes));
}
function decorationParent(el,kind){
 if(kind==='underline'){
  return el.tagName==='U' ||
   (el.style && (
    el.style.textDecorationLine.includes('underline') ||
    el.style.textDecoration.includes('underline')
   ));
 }
 if(kind==='color')return el.tagName==='FONT'&&el.hasAttribute('color')||
  !!(el.style&&el.style.color);
 if(kind==='marker')return !!(el.style&&el.style.backgroundColor)||
  el.classList.contains('compass-marker');
 return false;
}
function stripDecoration(root,kind){
 for(const el of Array.from(root.querySelectorAll('*')).reverse()){
  if(!el.isConnected)continue;
  if(kind==='underline'){
   if(el.tagName==='U'){unwrapElement(el);continue;}
   el.style?.removeProperty('text-decoration');
   el.style?.removeProperty('text-decoration-line');
   el.style?.removeProperty('text-decoration-style');
   el.style?.removeProperty('text-decoration-color');
   el.classList.remove('compass-underline');
  }else if(kind==='color'){
   if(el.tagName==='FONT')el.removeAttribute('color');
   el.style?.removeProperty('color');
  }else if(kind==='marker'){
   el.style?.removeProperty('background-color');
   el.style?.removeProperty('border-radius');
   el.classList.remove('compass-marker');
  }
 }
}
function liftOutOfDecoratedAncestors(node,kind){
 const editor=$('editor');
 let guard=0;
 while(node.parentElement&&node.parentElement!==editor&&guard++<60){
  const ancestor=node.parentElement;
  let parent=ancestor;
  let hasDecoration=false;
  while(parent&&parent!==editor){
   if(decorationParent(parent,kind)){hasDecoration=true;break;}
   parent=parent.parentElement;
  }
  if(!hasDecoration)break;
  const before=ancestor.cloneNode(false);
  const after=ancestor.cloneNode(false);
  while(ancestor.firstChild&&ancestor.firstChild!==node)before.append(ancestor.firstChild);
  while(node.nextSibling)after.append(node.nextSibling);
  if(before.childNodes.length)ancestor.before(before);
  ancestor.before(node);
  if(after.childNodes.length)ancestor.before(after);
  ancestor.remove();
 }
}
function formatSelection(kind,value){
 const range=selectedRange();
 if(!range||range.collapsed){
  alert('変更したい文字を選択してください');
  return;
 }
 try{
  const fragment=range.extractContents();
  const span=document.createElement('span');
  span.append(fragment);
  stripDecoration(span,kind);
  range.insertNode(span);
  liftOutOfDecoratedAncestors(span,kind);
  if(kind==='underline'&&value!=='none'){
   span.classList.add('compass-underline');
   span.style.textDecorationLine='underline';
   span.style.textDecorationStyle=value;
  }
  if(kind==='color'&&value!=='default')span.style.color=value;
  if(kind==='marker'&&value!=='remove'){
   span.classList.add('compass-marker');
   span.style.backgroundColor=value;
   span.style.borderRadius='.3em';
  }
  const updated=document.createRange();
  updated.selectNodeContents(span);
  const sel=window.getSelection();
  sel.removeAllRanges();
  sel.addRange(updated);
  selection=updated.cloneRange();
 }catch(e){
  alert('書式の変更に失敗しました。文字を選び直して試してください。');
 }
}
function applyUnderline(style){formatSelection('underline',style);}
function applyMarker(color){formatSelection('marker',color);}
/* リンク設定・変更・解除 */
function linkAtRange(range){
 if(!range)return null;

 const nodes=[
  range.startContainer,
  range.endContainer,
  range.commonAncestorContainer
 ];

 for(let node of nodes){
  if(node.nodeType===Node.TEXT_NODE){
   node=node.parentElement;
  }

  if(node instanceof Element){
   const a=node.closest('a');
   if(a&&$('editor').contains(a)){
    return a;
   }
  }
 }

 return null;
}

function insertLink(url,text){
 const a=document.createElement('a');
 a.href=url;
 a.textContent=text;
 a.rel='noopener noreferrer';
 insertNode(a);
}

$('linkBtn').onclick=()=>{
 const range=selectedRange();
 const existing=linkAtRange(range);

 const url=prompt(
  existing?'リンク先URLを変更':'リンク先URLを入力',
  existing?.getAttribute('href')||'https://'
 );

 if(url===null)return;

 if(!safeUrl(url)){
  alert('http:// または https:// のURLを入力してください');
  return;
 }

 if(existing){
  existing.href=url;
  rememberSelection();
  return;
 }

 if(range&&!range.collapsed){
  restoreSelection();

  // 選択した文字にリンクを設定
  document.execCommand('createLink',false,url);

  rememberSelection();
  return;
 }

 const text=prompt('リンクとして表示する文字',url);
 if(text===null||!text.trim())return;

 insertLink(url,text.trim());
};

$('unlinkBtn').onclick=()=>{
 const range=selectedRange();

 if(!range){
  alert('リンク内にカーソルを置くか、文字を選択してください');
  return;
 }

 const existing=linkAtRange(range);

 if(existing){
  unwrapElement(existing);
  selection=null;
  return;
 }

 if(range.collapsed){
  alert('リンクを解除したい文字を選択してください');
  return;
 }

 document.execCommand('unlink',false,null);
 rememberSelection();
};

/* COMPASS内の関連記事 */
function renderRelatedChoices(){
 const root=$('relatedList');
 root.replaceChildren();

 const words=$('relatedSearch').value
  .trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);

 const candidates=articles.filter(a=>
  a.status==='published' &&
  a.id!==editingId &&
  words.every(w=>(a.title||'').toLocaleLowerCase().includes(w))
 );

 if(!candidates.length){
  root.textContent='該当する公開記事がありません。';
  return;
 }

 for(const a of candidates){
  const b=document.createElement('button');
  b.type='button';
  b.className='related-choice';
  b.textContent=a.title;

  const small=document.createElement('small');
  small.textContent=names[a.category]||a.category;
  b.append(small);

  b.onclick=()=>{
   const link=document.createElement('a');
   link.href=new URL(
    'article.html?id='+encodeURIComponent(a.id),
    location.href
   ).href;
   link.className='compass-related';
   link.rel='noopener noreferrer';

   const label=document.createElement('span');
   label.className='compass-related-label';
   label.textContent='関連記事';

   const title=document.createElement('span');
   title.className='compass-related-title';
   title.textContent=a.title;

   const note=document.createElement('span');
   note.className='compass-related-note';
   note.textContent='こちらの記事もあわせてチェック！';

   link.append(label,title,note);
   insertNode(link);

   $('relatedPicker').classList.add('hidden');
   $('relatedSearch').value='';
  };

  root.append(b);
 }
}

$('relatedBtn').onclick=()=>{
 rememberSelection();
 $('relatedPicker').classList.toggle('hidden');

 if(!$('relatedPicker').classList.contains('hidden')){
  $('relatedSearch').value='';
  renderRelatedChoices();
  $('relatedSearch').focus();
 }
};

$('relatedSearch').oninput=renderRelatedChoices;
$('closeRelatedBtn').onclick=()=>{
 $('relatedPicker').classList.add('hidden');
};

/* アップロード */
async function upload(file,kind){
 if(!file)return;

 const valid=kind==='image'
  ?['image/jpeg','image/png','image/webp','image/gif']
  :['video/mp4','video/webm','video/quicktime'];

 if(!valid.includes(file.type)){
  alert('対応していない形式です。動画はMP4/WebM/MOV、画像はJPEG/PNG/WebP/GIFにしてください');
  return;
 }

 if(file.size>80*1024*1024){
  alert('ファイルは80MB以下にしてください');
  return;
 }

 const b=kind==='image'?$('imageFileBtn'):$('videoFileBtn');
 b.disabled=true;

 $('uploadStatus').textContent=
  'アップロード中：'+file.name+'（完了まで保存しないでください）';

 try{
  const form=new FormData();
  form.append('file',file);

  const res=await fetch(base()+'/api/upload',{
   method:'POST',
   headers:{Authorization:'Bearer '+auth},
   body:form
  });

  const obj=await res.json().catch(()=>({}));

  if(!res.ok){
   throw Error(obj.error||'HTTP '+res.status);
  }

  if(kind==='image'){
   const img=document.createElement('img');
   img.src=obj.url;
   img.alt='記事画像';
   insertNode(img);
  }else{
   const v=document.createElement('video');
   v.src=obj.url;
   v.controls=true;
   v.preload='metadata';
   v.setAttribute('playsinline','');
   insertNode(v);
  }

  $('uploadStatus').textContent='アップロード完了：'+file.name;
 }catch(e){
  $('uploadStatus').textContent='アップロード失敗：'+e.message;
  alert('アップロードエラー: '+e.message);
 }finally{
  b.disabled=false;
 }
}

$('videoUrlBtn').onclick=()=>{
 const url=prompt('YouTube動画または動画ファイルのURL');
 if(!url)return;

 let id='';

 try{
  const u=new URL(url);

  if(u.hostname==='youtu.be'){
   id=u.pathname.slice(1);
  }else if([
   'youtube.com',
   'www.youtube.com',
   'm.youtube.com'
  ].includes(u.hostname)){
   id=u.searchParams.get('v')
    ||(u.pathname.startsWith('/shorts/')
     ?u.pathname.split('/')[2]:'');
  }
 }catch(e){}

 if(/^[A-Za-z0-9_-]{11}$/.test(id)){
  const p=document.createElement('p');
  const a=document.createElement('a');

  a.href='https://www.youtube.com/watch?v='+id;
  a.textContent='▶ YouTube動画を見る';
  a.target='_blank';
  a.rel='noopener noreferrer';

  p.append(a);
  insertNode(p);
 }else if(safeUrl(url)&&/\.(mp4|webm|mov)(\?.*)?$/i.test(url)){
  const v=document.createElement('video');
  v.src=url;
  v.controls=true;
  v.preload='metadata';
  insertNode(v);
 }else{
  alert('YouTube共有URLか、MP4/WebM/MOVの直接URLを入力してください');
 }
};

/* iPhoneキーボード上の書式ツールバー */
(function setupFloatingToolbar(){
 const editor=$('editor');
 const viewport=window.visualViewport;
 let hideTimer=null;

 function updatePosition(){
  if(!document.body.classList.contains('editor-active')){
   return;
  }

  let offset=0;

  if(viewport){
   offset=Math.max(
    0,
    window.innerHeight-
    viewport.height-
    viewport.offsetTop
   );
  }

  document.documentElement.style.setProperty(
   '--keyboard-offset',
   offset+'px'
  );
 }

 function showToolbar(){
  clearTimeout(hideTimer);
  document.body.classList.add('editor-active');
  updatePosition();
 }

 function hideToolbar(){
  hideTimer=setTimeout(()=>{
   if(
    document.activeElement!==editor &&
    !document.querySelector('.toolbar:focus-within') &&
    !document.querySelector('.marker-tools:focus-within')
   ){
    document.body.classList.remove('editor-active');
    document.documentElement.style.removeProperty(
     '--keyboard-offset'
    );
   }
  },350);
 }

 editor.addEventListener('focus',showToolbar);
 editor.addEventListener('blur',hideToolbar);

 document.querySelectorAll(
  '.toolbar,.marker-tools'
 ).forEach(element=>{
  element.addEventListener('pointerdown',()=>{
   clearTimeout(hideTimer);
  });
 });

 if(viewport){
  viewport.addEventListener('resize',updatePosition);
  viewport.addEventListener('scroll',updatePosition);
 }

 window.addEventListener('resize',updatePosition);
})();
